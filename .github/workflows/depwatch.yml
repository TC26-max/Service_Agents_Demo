name: depwatch
# v3.4 (Phase 3 of the November audit): every package in package-lock.json and every action these workflows
# use, checked daily against OSV advisories, CVE records (the CNA's score first), CISA KEV and FIRST EPSS.
# Known exploited fails; high severity or likely exploitation fails for what the site or this pipeline runs and
# warns for development packages. The result is the job summary and the "deps" artifact; the badge in the
# README is this workflow's own status. NVD_API_KEY (optional secret) speeds up the rare NVD lookups.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - package-lock.json
      - ".github/workflows/**"
      - tools/depwatch.mjs
permissions:
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check dependencies
        run: node tools/depwatch.mjs --out dist/deps
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Summary
        if: always()
        run: if [ -f dist/deps/summary.md ]; then cat dist/deps/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deps
          path: dist/deps/
          if-no-files-found: ignore
